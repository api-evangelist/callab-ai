kind: company
description: >-
  Callab AI, built by Clusterlabs, is a cloud-based voice AI platform that connects directly to
  legacy on-premises PBX/SBC telephony (Cisco UCM, Mitel, FreeSWITCH) via SIP trunk integration,
  routing calls to AI voice agents with no rip-and-replace migration. The platform automates up to
  70% of inbound and outbound call volume across support, sales, and scheduling, with no-code agent
  building, live human supervision and takeover, semantic knowledge bases, post-call transcription
  and sentiment analysis, CRM data extraction, and batch outbound campaigns. Callab AI exposes a
  REST API at docs.callab.ai for programmatic control of agents and calls. A Y Combinator Spring
  2026 company founded in 2024, it serves hospitality, logistics, retail, and property management
  across three continents.
